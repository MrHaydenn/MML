name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mml-experimental-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Stamp experimental build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');const parts=p.version.split('.').map(Number);p.version=parts[0]+'.'+parts[1]+'.'+(parts[2]+1)+'-experimental.'+process.env.GITHUB_RUN_NUMBER;p.build.publish={provider:'generic',url:'https://github.com/MrHaydenn/MML/releases/download/experimental',channel:'experimental'};p.mmlRevision=process.env.GITHUB_SHA;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - run: pnpm dist
      - name: Publish experimental installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view experimental *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create experimental --target "$env:GITHUB_SHA" --title "MML Experimental" --notes "Latest successfully built push to main. Opt in through MML Settings. This prerelease is separate from Stable." --prerelease --latest=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $assets = Get-ChildItem release/*.exe,release/*.blockmap | ForEach-Object FullName
          gh release upload experimental @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload experimental release/experimental.yml --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit experimental --prerelease --latest=false
      - uses: actions/upload-artifact@v4
        with:
          name: MML-Windows-x64
          path: release/*.exe
