name: Publish stable release
on:
  push:
    branches: [main]
    paths: [release-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mml-stable
  cancel-in-progress: false
jobs:
  stable:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Validate release request
        run: node -e "const p=require('./package.json');const r=require('./release-request.json');if(p.version!==r.version||!/^\d+\.\d+\.\d+$/.test(r.version))throw Error('Release request must match a stable package version')"
      - run: pnpm dist
      - name: Publish stable installer and updater feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release create "v$version" "release/MML-Setup-$version.exe" "release/MML-Setup-$version.exe.blockmap" release/latest.yml --target "$env:GITHUB_SHA" --title "MML $version" --notes-file RELEASE_NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "v$version" --draft=false --latest
